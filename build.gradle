plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '2.7.13'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'com.mtf'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '1.8'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.0'
	implementation group: 'org.bgee.log4jdbc-log4j2', name:'log4jdbc-log4j2-jdbc4.1', version: '1.16'
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
	implementation 'javax.servlet:jstl'
	implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.9'
	implementation 'org.apache.httpcomponents:httpclient:4.5.13'
	implementation group: 'org.apache.httpcomponents', name: 'httpmime', version: '4.5.13'

	implementation group: 'org.apache.poi', name: 'poi', version: '4.1.2'
	implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '4.1.2'

	// 2026-10-30 보안 조치: 회원 작성 HTML(커뮤니티) 정화용. Java 8 호환 버전으로 고정
	implementation 'org.jsoup:jsoup:1.15.3'

	implementation fileTree(dir : 'src/main/webapp/WEB-INF/lib', include : [ '*.jar'])

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.0.6'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 2026-10-30: WEB-INF/lib 의 jar 가 의존성(fileTree)과 webapp 복사본으로 두 번 들어가 Gradle 7 에서 war/bootWar 가
// "cos.jar is a duplicate" 로 실패하던 것을 같은 파일이므로 한 번만 넣도록 지정. 런타임 동작 변화 없음.
tasks.withType(War).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}